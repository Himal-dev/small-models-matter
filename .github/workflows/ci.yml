name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6'
          python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check src scripts tests
      - name: Smoke tests
        run: python -m pytest -q
      - name: Benchmark smoke run
        run: python scripts/benchmark.py --runs 2000
      - name: Build static demo
        run: python scripts/build_pages.py
